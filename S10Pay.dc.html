<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>S10 · Оплата</title>
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/colors.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/typography.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/radius.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/shadow.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/size.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/base.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/styles.css">
  <script src="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/_ds_bundle.js"></script>
</helmet>
<div class="uv" style="width:390px;height:844px;overflow-y:auto;background:var(--bg);font-size:calc(17px * var(--uv-text-scale, 1))">
  <x-import component-from-global-scope="Ds_722904.TopBar" show-back="{{ yes }}" on-back="{{ back }}" hint-size="390px,48px"></x-import>
  <div style="padding:8px 20px 0">
    <h1 style="margin:0;font-size:calc(28px * var(--uv-text-scale, 1));line-height:1.21;font-weight:700;letter-spacing:-0.02em">Оплата</h1>
  </div>
  <div style="display:flex;flex-direction:column;gap:24px;padding:24px 20px 32px">
    <div class="uv-card">
      <span class="uv-card__meta">К оплате</span>
      <span class="uv-amount">{{ amountMoney }}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:calc(15px * var(--uv-text-scale, 1));font-weight:600">Способ оплаты</span>
      <div style="display:flex;background:var(--primary-soft);border-radius:var(--radius-md);padding:4px;gap:4px">
        <button onClick="{{ setSbp }}" style="flex:1;height:44px;border:none;border-radius:calc(var(--radius-md) - 2px);cursor:pointer;font:inherit;font-size:calc(15px * var(--uv-text-scale, 1));background:{{ sbpBg }};color:{{ sbpColor }};font-weight:{{ sbpWeight }};display:flex;align-items:center;justify-content:center;gap:6px">
          <span aria-hidden="true" class="uv-icon" style="font-size:20px;width:20px;height:20px">payments</span>СБП
        </button>
        <button onClick="{{ setCard }}" style="flex:1;height:44px;border:none;border-radius:calc(var(--radius-md) - 2px);cursor:pointer;font:inherit;font-size:calc(15px * var(--uv-text-scale, 1));background:{{ cardBg }};color:{{ cardColor }};font-weight:{{ cardWeight }};display:flex;align-items:center;justify-content:center;gap:6px">
          <span aria-hidden="true" class="uv-icon" style="font-size:20px;width:20px;height:20px">credit_card</span>Карта
        </button>
      </div>
    </div>
    <x-import component-from-global-scope="Ds_722904.Button" state="{{ payState }}" on-click="{{ pay }}" hint-size="100%,52px">Оплатить {{ amountMoney }}</x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;app&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;act&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
const DEMO = { debt: 1248.60, payAmount: 1248.60, payMethod: 'sbp' };
function money(n) {
  const p = Number(n).toFixed(2).split('.');
  return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0') + ',' + p[1] + '\u00A0₽';
}
const NOOP = { back(){}, setPayMethod(){}, pay(){}, money: n => money(n) };

class Component extends DCLogic {
  state = { paying: false };

  renderVals() {
    const app = this.props.app ?? DEMO;
    const act = this.props.act ?? NOOP;
    const isSbp = (app.payMethod || 'sbp') !== 'card';
    return {
      yes: true,
      back: () => act.back(),
      amountMoney: act.money(app.payAmount ?? app.debt),
      setSbp: () => act.setPayMethod('sbp'),
      setCard: () => act.setPayMethod('card'),
      sbpBg: isSbp ? 'var(--surface)' : 'transparent',
      sbpColor: isSbp ? 'var(--primary)' : 'var(--text-secondary)',
      sbpWeight: isSbp ? '600' : '400',
      cardBg: !isSbp ? 'var(--surface)' : 'transparent',
      cardColor: !isSbp ? 'var(--primary)' : 'var(--text-secondary)',
      cardWeight: !isSbp ? '600' : '400',
      payState: this.state.paying ? 'loading' : 'default',
      pay: () => {
        if (this.state.paying) return;
        this.setState({ paying: true });
        setTimeout(() => act.pay(), 800);
      }
    };
  }
}
</script>
</body>
</html>
