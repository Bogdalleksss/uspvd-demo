<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>S15 · Как распознать мошенника</title>
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/colors.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/typography.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/radius.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/shadow.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/size.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/base.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/styles.css">
  <script src="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/_ds_bundle.js"></script>
</helmet>
<div class="uv" style="width:100%;height:100%;overflow-y:auto;background:var(--bg);font-size:calc(17px * var(--uv-text-scale, 1))">
  <x-import component-from-global-scope="Ds_722904.TopBar" show-back="{{ yes }}" on-back="{{ back }}" hint-size="390px,48px"></x-import>
  <div style="display:flex;flex-direction:column;gap:20px;padding:8px 20px 32px">
    <span aria-hidden="true" class="uv-icon" style="font-size:40px;width:48px;height:48px;color:var(--brand-blue)">shield</span>
    <h1 style="margin:0;font-size:calc(28px * var(--uv-text-scale, 1));line-height:1.21;font-weight:700;letter-spacing:-0.02em">Как распознать мошенника</h1>
    <div style="display:flex;flex-direction:column;gap:16px">
      <sc-for list="{{ rules }}" as="rule" hint-placeholder-count="5">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <span style="flex:none;width:28px;height:28px;border-radius:var(--radius-full);background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:calc(15px * var(--uv-text-scale, 1));display:flex;align-items:center;justify-content:center">{{ rule.n }}</span>
          <span style="padding-top:3px">{{ rule.text }}</span>
        </div>
      </sc-for>
    </div>
    <a href="{{ hotlineHref }}" class="uv-btn uv-btn--primary" style="text-decoration:none;margin-top:8px">Позвонить на горячую линию</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;app&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;act&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
const DEMO = { hotline: '+7 (86140) 57-301', hotlineTel: '+78614057301' };
const NOOP = { back(){} };
const RULES = [
  'сотрудники водоканала не просят код из SMS',
  'не просят данные банковской карты',
  'не требуют срочно заменить или поверить счётчик под угрозой штрафа',
  'не приходят без предупреждения — спросите удостоверение',
  'сомневаетесь — положите трубку и позвоните на горячую линию сами'
];

class Component extends DCLogic {
  renderVals() {
    const app = this.props.app ?? DEMO;
    const act = this.props.act ?? NOOP;
    return {
      yes: true,
      back: () => act.back(),
      rules: RULES.map((text, i) => ({ n: String(i + 1), text: text })),
      hotlineHref: 'tel:' + (app.hotlineTel || DEMO.hotlineTel)
    };
  }
}

</script>
</body>
</html>
