<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>S07 · Проверка</title>
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/colors.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/typography.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/radius.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/shadow.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/size.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/base.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/styles.css">
  <script src="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/_ds_bundle.js"></script>
</helmet>
<div class="uv" style="width:390px;height:844px;overflow-y:auto;background:var(--bg);font-size:calc(17px * var(--uv-text-scale, 1))">
  <x-import component-from-global-scope="Ds_722904.TopBar" show-back="{{ yes }}" on-back="{{ back }}" hint-size="390px,48px"></x-import>
  <div style="padding:8px 20px 0">
    <h1 style="margin:0;font-size:calc(28px * var(--uv-text-scale, 1));line-height:1.21;font-weight:700;letter-spacing:-0.02em">{{ heading }}</h1>
  </div>
  <div style="display:flex;flex-direction:column;gap:24px;padding:24px 20px 32px">
    <sc-for list="{{ meterRows }}" as="m" hint-placeholder-count="2">
      <div class="uv-card">
        <h3 class="uv-card__title">{{ m.title }}</h3>
        <p class="uv-card__meta">Было {{ m.prevText }} → Стало {{ m.newText }}</p>
        <p class="uv-card__meta">Расход {{ m.usageText }} м³</p>
      </div>
    </sc-for>
    <div style="display:flex;flex-direction:column;gap:8px">
      <x-import component-from-global-scope="Ds_722904.Button" state="{{ sendState }}" on-click="{{ send }}" hint-size="100%,52px">Всё верно, отправить</x-import>
      <button onClick="{{ back }}" class="uv-btn uv-btn--text" style="align-self:center">Исправить</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;app&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;act&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
const DEMO = { meters: [
  { id: 'home', title: 'Дом', prev: 123, value: 131 },
  { id: 'garden', title: 'Полив', prev: 457, value: 465 }
], consumption: { home: 8, garden: 8 } };
const NOOP = { back(){}, submitReadings(){}, reading: n => String(n).padStart(5, '0') };

class Component extends DCLogic {
  state = { sending: false };

  renderVals() {
    const app = this.props.app ?? DEMO;
    const act = this.props.act ?? NOOP;
    const single = app.meters.length === 1;
    const meterRows = app.meters.map(m => ({
      title: m.title,
      prevText: act.reading(m.prev),
      newText: act.reading(m.value),
      usageText: String((app.consumption && app.consumption[m.id]) ?? (m.value - m.prev))
    }));
    return {
      yes: true,
      back: () => act.back(),
      heading: single ? 'Проверьте показания' : 'Проверьте, всё ли верно',
      meterRows: meterRows,
      sendState: this.state.sending ? 'loading' : 'default',
      send: () => {
        if (this.state.sending) return;
        this.setState({ sending: true });
        setTimeout(() => act.submitReadings(), 1000);
      }
    };
  }
}

</script>
</body>
</html>
