<div class="uv" style="width:390px;height:844px;overflow-y:auto;background:var(--bg);font-size:calc(17px * var(--uv-text-scale, 1));display:flex;flex-direction:column">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center">
    <span aria-hidden="true" class="uv-icon uv-icon--fill" style="font-size:64px;width:80px;height:80px;color:var(--success-text)">check_circle</span>

  </div>
  <div style="flex:none;padding:0 20px 32px">
    <x-import component-from-global-scope="Ds_722904.Button" on-click="{{ home }}" hint-size="100%,52px">На главную</x-import>
  </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;app&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;act&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
const DEMO = { lastPayment: { date: 'Сегодня, 10:45', amount: 1248.60, method: 'СБП', receiptNo: 'Ч-000418' } };
function money(n) {
  const p = Number(n).toFixed(2).split('.');
  return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0') + ',' + p[1] + '\u00A0₽';
}
const NOOP = { home(){}, money: n => money(n) };

class Component extends DCLogic {
  renderVals() {
    const app = this.props.app ?? DEMO;
    const act = this.props.act ?? NOOP;
    const lp = app.lastPayment || DEMO.lastPayment;
    return {
      amountMoney: act.money(lp.amount),
      method: lp.method,
      receipt: lp.receiptNo,
      date: lp.date,
      home: () => act.home()
    };
  }
}
</script>
