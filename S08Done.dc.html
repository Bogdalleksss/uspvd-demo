<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>S08 · Показания приняты</title>
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/colors.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/typography.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/radius.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/shadow.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/size.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/tokens/base.css">
  <link rel="stylesheet" href="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/styles.css">
  <script src="_ds/ds-7229045f-139b-49b0-b752-7428fd33e88a/_ds_bundle.js"></script>
</helmet>
<div class="uv" style="width:390px;height:844px;overflow-y:auto;background:var(--bg);font-size:calc(17px * var(--uv-text-scale, 1));display:flex;flex-direction:column">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center">
    <span aria-hidden="true" class="uv-icon uv-icon--fill" style="font-size:64px;width:80px;height:80px;color:var(--success-text)">check_circle</span>
    <h1 style="margin:0;font-size:calc(24px * var(--uv-text-scale, 1));line-height:1.3;font-weight:700">Показания приняты</h1>
    <p style="margin:0;font-size:calc(17px * var(--uv-text-scale, 1));color:var(--text-secondary)">{{ sentAt }}</p>
    <p style="margin:0;font-size:calc(15px * var(--uv-text-scale, 1));color:var(--text-secondary)">Номер приёма: {{ receipt }}</p>
    <div style="display:flex;flex-direction:column;gap:4px;margin-top:8px">
      <sc-for list="{{ meterRows }}" as="m" hint-placeholder-count="2">
        <span style="font-size:calc(17px * var(--uv-text-scale, 1))">{{ m.title }}: {{ m.valueText }} м³</span>
      </sc-for>
    </div>
  </div>
  <div style="flex:none;padding:0 20px 32px">
    <x-import component-from-global-scope="Ds_722904.Button" on-click="{{ home }}" hint-size="100%,52px">На главную</x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;app&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;act&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
const DEMO = { readingsSentAt: 'Сегодня, 10:42', receiptNo: '2026-09-0418', meters: [
  { id: 'home', title: 'Дом', value: 131 },
  { id: 'garden', title: 'Полив', value: 465 }
] };

const NOOP = { home(){}, reading: n => String(n).padStart(5, '0') };

class Component extends DCLogic {
  renderVals() {
    const app = this.props.app ?? DEMO;
    const act = this.props.act ?? NOOP;
    return {
      sentAt: app.readingsSentAt || '—',
      receipt: app.receiptNo || '—',
      meterRows: app.meters.map(m => ({ title: m.title, valueText: act.reading(m.value) })),
      home: () => act.home()
    };
  }
}

</script>
</body>
</html>
